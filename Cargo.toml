[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Omakidx/hash-xcreen"
publish = false

# Versions shared by several members. Each crate opts in with `dep.workspace = true`.
[workspace.dependencies]
hx-capture = { path = "crates/hx-capture", version = "0.1.0" }
hx-codec = { path = "crates/hx-codec", version = "0.1.0" }
hx-proto = { path = "crates/hx-proto", version = "0.1.0" }
hx-crypto = { path = "crates/hx-crypto", version = "0.1.0" }
hx-ipc = { path = "crates/hx-ipc", version = "0.1.0", default-features = false }
hx-provision = { path = "crates/hx-provision", version = "0.1.0" }
hx-session = { path = "apps/hx-session", version = "0.1.0" }
hx-transport = { path = "crates/hx-transport", version = "0.1.0" }
bytes = "1"
crossbeam-channel = "0.5"
# Microbenchmarks (docs/testing.md). No default features: no plotting stack, no rayon.
criterion = { version = "0.8", default-features = false }
# Links the system FFmpeg (6.1 on Ubuntu 24.04) through pkg-config; 7.1 is the newest ffmpeg-next that supports it.
ffmpeg-next = { version = "7.1", default-features = false, features = ["codec", "format"] }
prost = "0.14"
rustix = { version = "1", default-features = false, features = ["std"] }
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
x11rb = { version = "0.13", default-features = false }
yuvutils-rs = "0.8" # default features keep the SSE/AVX conversion paths
zeroize = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
