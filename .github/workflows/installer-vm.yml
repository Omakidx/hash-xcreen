name: Installer VM

# The real installer on fresh KVM VMs (design D8 b, docs/spikes/1e-installer-nested-incus.md).
#
# Each cell launches a VM of one host OS under Incus on a GitHub runner, runs the real install.sh
# (test-keyed copy, --release-dir) and hx-agent install with secrets on stdin, and checks the units
# under real systemd, pairing and PIN login from the runner, the first frame of the desktop built
# inside the VM, the secrets canary, the hx-provision host-ruleset checklist, failure injection and
# resume, idempotence, a pending update whose privd fails, a VM reboot, and uninstall in both modes
# with an empty-leftovers check.
#
# Both image paths (design 1D, docs/architecture.md 12). The `artifacts` job builds the agent with
# a per-run TEST image key (feature `test-image-key`) and a real prebuilt image
# (`hx-imagectl build-image --recipe ubuntu-24.04-xfce-basic`, on a runner with the same Incus setup
# as images.yml), and signs its manifest with that key:
#   build cells     pass `--image build` and assert reason_code=build_requested.
#   prebuilt cells  install from the test-signed image with `--image-file /root/img/<file>` (the
#                   offline path; the recipe is chosen by --distro, not by the host OS, so every host
#                   OS installs the same image). A manifest with one flipped byte must give exit 10
#                   and change nothing; the real install must give path_taken=PREBUILT and
#                   reason_code=image_file, the first frame, an empty /var/lib/hx/import, no hx-img-*
#                   image, and a clean uninstall.
#   auto variant    (ubuntu-24.04) no --image option: this test agent cannot use the published
#                   manifest, so it must build with list_unavailable, list_unverified or
#                   no_matching_image.
# The ONLINE prebuilt path is covered by privd's integration tests (a local HTTPS server and a fake
# Incus); a nightly `prebuilt-online` canary cell comes once the real image keys exist.
#
# Triggers: nightly, workflow_dispatch, and pull requests that carry the `installer-vm` label or
# touch the installer (see the gate job).
#
# Debian 12 has no Incus in its main archive, so its build cell installs Incus from the Zabbly
# repository with the pinned key in src/install/zabbly-key.asc; the cell skips itself with a warning
# annotation if that file ever reads UNPROVISIONED again (run-cell.sh); the same holds for its
# prebuilt cell, which also needs Incus.
#
# Variants exercise the installer paths the other cells do not:
#   docker       `--docker` needs Incus 6.0.5 or newer, which the distro archives of ubuntu-24.04
#                (6.0.0) and debian-13 (6.0.4) do not have, so the incus stage must take Zabbly.
#                Checks: the Zabbly source and version, nesting and the mknod and setxattr
#                intercepts, the user in the docker group, `docker run --rm hello-world` inside
#                the desktop (before and after a reboot), and the rest of the full cell.
#   auto         the default `--image auto` (see above); a shorter cell.
#   interactive  `--interactive` answered on a pseudo-terminal by tests/installer-vm/tty-driver.py:
#                the prompts, a refused answer, hidden secrets asked twice, the printed pairing
#                code, QUIC pairing with that code and the typed PIN, the canary, the checklist,
#                a re-run that must not ask again, uninstall.
#
# This workflow could not be run where it was written (no /dev/kvm there); the local nested
# container run (apps/hx-agent/tests/install_nested_incus.rs) covers the same installer flow.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: installer-vm-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            run=false
            if echo "$LABELS" | grep -q '"installer-vm"'; then
              run=true
            elif git diff --name-only "origin/$BASE...HEAD" |
              grep -Eq '^(installer/|apps/hx-agent/src/install/|apps/hx-agent/systemd/|tests/installer-vm/|\.github/workflows/installer-vm\.yml)'; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "installer-vm cells will run: $run"

  artifacts:
    name: Test-keyed release, client and test image
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Install system libraries
        # The same FFmpeg, libx264 and libclang set as the CI jobs (hx-session and the test client
        # link the system FFmpeg), plus dpkg-dev for dpkg-shlibdeps (the hx-session package).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev dpkg-dev jq
      - uses: Swatinem/rust-cache@v2
      - name: Self-test of the pty driver of the interactive cell
        run: tests/installer-vm/test-tty-driver.sh
      - name: Install and prepare Incus (containers only, no KVM) for the test image
        # The same steps as the `image` job of images.yml: the image is built by `hx-imagectl
        # build-image` in a container on a btrfs pool (a loop file on /mnt, the big disk).
        run: |
          set -eu
          # With recommends: incus only recommends dnsmasq-base (its managed bridge needs it).
          # This is the CI runner, not a host under test.
          sudo apt-get update -q
          sudo apt-get install -y incus incus-client dnsmasq-base btrfs-progs zstd
          sudo incus admin init --minimal
          sudo mkdir -p /mnt/incus-disks /var/lib/incus/disks
          sudo mount --bind /mnt/incus-disks /var/lib/incus/disks
          sudo modprobe btrfs || true
          grep -qw btrfs /proc/filesystems || { echo "::error::this runner kernel has no btrfs"; exit 1; }
          # Docker on the runner drops forwarded traffic of an Incus bridge (hxci-br0 is the
          # builder's, incusbr0 the default one).
          for br in hxci-br0 incusbr0; do
            sudo iptables -I DOCKER-USER -i "$br" -j ACCEPT || true
            sudo iptables -I DOCKER-USER -o "$br" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT || true
          done
          # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor, which can stop
          # containers from starting. Runner only; this is not the host the product installs on.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo incus version
          df -h /mnt /var/lib/incus/disks
      - name: Build the test-keyed release directory, the client and the test-signed image
        run: tests/installer-vm/build-artifacts.sh "$RUNNER_TEMP/artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-vm-artifacts
          # The image is a separate artifact: only the prebuilt cells download it.
          path: |
            ${{ runner.temp }}/artifacts
            !${{ runner.temp }}/artifacts/img
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installer-vm-image
          path: ${{ runner.temp }}/artifacts/img
          # the image is already zstd-compressed
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  cell:
    name: ${{ matrix.os }} / ${{ matrix.image }}${{ matrix.variant != 'none' && format(' / {0}', matrix.variant) || '' }}
    needs: [gate, artifacts]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Debian 12 needs Zabbly for Incus, whose key is not provisioned yet (see the header).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, debian-12, debian-13]
        image: [build, prebuilt]
        variant: [none]
        include:
          # ufw active on the host: the port rule must open 443 through ufw.
          - os: ubuntu-24.04
            image: build
            variant: ufw
          # Docker on the host with a published port: DOCKER-USER rules and the DNAT drop.
          - os: debian-13
            image: build
            variant: docker-host
          # --allow-private-networks: the private-range probes succeed (checklist item 5).
          - os: ubuntu-24.04
            image: build
            variant: private
          # --docker: Incus 6.0.5+ from Zabbly, nesting, Docker running inside the desktop.
          - os: ubuntu-24.04
            image: build
            variant: docker
          - os: debian-13
            image: build
            variant: docker
          # --interactive on a pseudo-terminal: prompts, hidden secrets, the printed pairing code.
          - os: ubuntu-24.04
            image: build
            variant: interactive
          # No --image option (auto): this test agent cannot use the published manifest, so it builds
          # (list_unavailable, list_unverified or no_matching_image).
          - os: ubuntu-24.04
            image: build
            variant: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer-vm-artifacts
          path: ${{ runner.temp }}/artifacts
      - uses: actions/download-artifact@v4
        if: matrix.image == 'prebuilt'
        with:
          name: installer-vm-image
          path: ${{ runner.temp }}/artifacts/img
      - name: Runtime libraries of the client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev jq
          chmod +x "$RUNNER_TEMP/artifacts/client"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install and initialise Incus
        run: |
          # With recommends: incus only recommends dnsmasq-base (its managed bridge needs it), and
          # Ubuntu's qemu-system-x86 only recommends the SPICE module that Incus VMs need. This is
          # the CI runner, not a host under test: the installer installs its own minimal set.
          sudo apt-get update -q
          sudo apt-get install -y incus incus-client dnsmasq-base qemu-system-x86 qemu-system-modules-spice ovmf qemu-utils
          sudo incus admin init --minimal
          # VM disks (40 GiB each) live on /mnt, the big disk of the runner.
          sudo mkdir -p /mnt/incus
          sudo incus storage create ci dir source=/mnt/incus
          sudo incus profile device remove default root
          sudo incus profile device add default root disk path=/ pool=ci
          # Docker on the runner drops forwarded traffic of the Incus bridge.
          sudo iptables -I DOCKER-USER -i incusbr0 -j ACCEPT || true
          sudo iptables -I DOCKER-USER -o incusbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT || true
          sudo incus version
      - name: Run the cell
        env:
          CELL_OS: ${{ matrix.os }}
          CELL_IMAGE: ${{ matrix.image }}
          CELL_VARIANT: ${{ matrix.variant }}
          ART: ${{ runner.temp }}/artifacts
          OUT: ${{ runner.temp }}/out
        run: tests/installer-vm/run-cell.sh
      - name: Stage timings
        if: always()
        run: |
          f="$RUNNER_TEMP/out/stages.tsv"
          if [ -s "$f" ]; then
            {
              echo "### ${{ matrix.os }} / ${{ matrix.image }} / ${{ matrix.variant }}: install duration per stage (ms)"
              echo
              echo "| stage | ms |"
              echo "|---|---|"
              awk -F'\t' '{print "| " $1 " | " $2 " |"}' "$f"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cell-${{ matrix.os }}-${{ matrix.image }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/out
          retention-days: 7
          if-no-files-found: ignore
