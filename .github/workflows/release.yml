name: Release

# Design D7 of the 1E installer. A tag `v<workspace version>` publishes a signed release; a manual
# run (workflow_dispatch) is a DRY RUN: it builds every artifact, signs with a per-run TEST key,
# proves that install.sh accepts the result, uploads the files as a workflow artifact and publishes
# nothing (no environment secret is used, nothing is attested or released).
#
# Maintainer setup (the keys are never generated by, or visible to, an agent):
#   - environment `release-signing` with required reviewers (manual approval per run) and the
#     secrets MINISIGN_SECRET_KEY (the secret key file text) and MINISIGN_KEY_PASSWORD;
#   - the public keys in apps/hx-agent/release-keys/{current,next}.pub and in installer/install.sh
#     (KEY_CURRENT, KEY_NEXT); the gate job refuses a release until both are provisioned.

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # rustup itself is pinned (the toolchain is pinned by rust-toolchain.toml): never an unpinned
  # `curl | sh`. The digest is the one published next to the file at
  # https://static.rust-lang.org/rustup/archive/1.29.3/x86_64-unknown-linux-gnu/rustup-init.sha256
  RUSTUP_VERSION: "1.29.3"
  RUSTUP_SHA256: "b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55"

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      sde: ${{ steps.meta.outputs.sde }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # the whole history of every branch: the tag commit must be shown to be on main
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Version, channel and mode
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          case "$version" in
            *-*) channel=beta ;;
            *) channel=stable ;;
          esac
          if [ "$EVENT" = push ]; then
            dry_run=false
            # A tag can be pushed from any branch. A release is only built and signed from a commit
            # that is on main (and so went through review): fail the gate early otherwise.
            git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null ||
              { echo "::error::origin/main is not available: cannot check the tag is on main"; exit 1; }
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "::error::tag $REF_NAME ($GITHUB_SHA) is not on main: refusing to build or sign it"
              exit 1
            fi
            sh release/gate.sh --tag "$REF_NAME"
          else
            dry_run=true
            sh release/gate.sh --dry-run
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "dry_run=$dry_run"
            echo "sde=$(git show -s --format=%ct HEAD)"
          } >>"$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit
      - name: install.sh known-answer tests and hand-off suite
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dash
          sh installer/tests/run.sh dash
          sh installer/tests/handoff.sh dash

  agent:
    name: Agent binaries (static musl)
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain and the musl target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          # ring needs a C compiler for musl
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        env:
          DRY_RUN: ${{ needs.gate.outputs.dry_run }}
        run: |
          set -eu
          # Only the agent's bins: never --workspace or --all-targets (they would pull in the
          # dev-dependency on hx-agent's own test features). A dry run has no release keys, so it
          # builds without the gate; a real release enables it (a compile error unless BOTH
          # release-keys/*.pub are provisioned).
          if [ "$DRY_RUN" = true ]; then
            cargo build -p hx-agent --bins --release --locked --target x86_64-unknown-linux-musl
          else
            cargo build -p hx-agent --bins --release --locked --target x86_64-unknown-linux-musl --features release-build
          fi
      - name: Collect and check the binaries
        run: |
          set -eu
          out=agent-bins
          mkdir "$out"
          rel=target/x86_64-unknown-linux-musl/release
          for f in "$rel"/hx-*; do
            if [ ! -f "$f" ] || [ ! -x "$f" ]; then continue; fi
            case "$f" in *.d) continue ;; esac
            # statically linked: no program interpreter
            if readelf -l "$f" | grep -q INTERP; then echo "::error::$f is dynamically linked"; exit 1; fi
            cp "$f" "$out/"
          done
          for b in hx-privd hx-gatewayd hx-agent hx-update-fetcher hx-backup-worker; do
            [ -f "$out/$b" ] || { echo "::error::$b was not built"; exit 1; }
          done
          ls -l "$out"
          # all bins are bins of one crate, so one CARGO_PKG_VERSION by construction
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-bins
          path: agent-bins
          if-no-files-found: error

  session:
    name: hx-session.deb (${{ matrix.distro }})
    needs: gate
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-24.04, image: "ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b" }
          - { distro: ubuntu-26.04, image: "ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db" }
          - { distro: debian-12, image: "debian:12@sha256:1d04200c2ece1d4d75a2a6f8e11ebce7d86a2ae28b34bb2c9cbb3ee9f4953e75" }
          - { distro: debian-13, image: "debian:13@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2" }
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # dpkg-dev: dpkg-shlibdeps and dpkg-deb. The FFmpeg dev packages are this distro's own:
          # ffmpeg-sys-next links them through pkg-config, and clang/libclang generate its bindings.
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential clang libclang-dev pkg-config dpkg-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev libcrypt-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install rustup (pinned) and the pinned toolchain
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          rustup toolchain install
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - name: Build hx-session and hx-pwcheck
        run: |
          # hx-pwcheck is built WITHOUT its test-only feature `test-shadow-path` (an
          # HX_PWCHECK_SHADOW override of the shadow file path): only the crate's own
          # dev-dependency on itself ever enables it.
          cargo build --release --locked -p hx-session --bin hx-session -p hx-pwcheck
      - name: The release hx-pwcheck must not honour the test override
        run: |
          if grep -aq HX_PWCHECK_SHADOW target/release/hx-pwcheck; then
            echo "::error::hx-pwcheck was built with test-shadow-path"
            exit 1
          fi
      - name: Build the .deb
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SDE: ${{ needs.gate.outputs.sde }}
          DISTRO: ${{ matrix.distro }}
        run: |
          sh packaging/hx-session/build-deb.sh --version "$VERSION" --distro "$DISTRO" \
            --bin-dir target/release --out "out/$DISTRO" --source-date-epoch "$SDE"
          dpkg-deb -I "out/$DISTRO/hx-session.deb"
          dpkg-deb -c "out/$DISTRO/hx-session.deb"
      - name: The recipe installs everything the .deb depends on
        env:
          DISTRO: ${{ matrix.distro }}
        run: sh packaging/hx-session/check-recipe-covers-depends.sh --deb "out/$DISTRO/hx-session.deb" --distro "$DISTRO"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-${{ matrix.distro }}
          path: out/${{ matrix.distro }}/hx-session.deb
          if-no-files-found: error

  session-smoke:
    name: .deb smoke test (${{ matrix.distro }})
    needs: session
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-24.04, image: "ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b" }
          - { distro: ubuntu-26.04, image: "ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db" }
          - { distro: debian-12, image: "debian:12@sha256:1d04200c2ece1d4d75a2a6f8e11ebce7d86a2ae28b34bb2c9cbb3ee9f4953e75" }
          - { distro: debian-13, image: "debian:13@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2" }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: session-${{ matrix.distro }}
      - name: Install in a clean container and resolve every library
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ./hx-session.deb
          for f in /usr/lib/hx-session/*; do
            echo "== $f"
            ldd "$f"
            if ldd "$f" | grep -q 'not found'; then echo "::error::unresolved library in $f"; exit 1; fi
          done
          test "$(stat -c '%U:%G %a' /usr/lib/hx-session/hx-session)" = "root:root 755"

  desktop-deb:
    name: hx-desktop .deb (${{ matrix.distro }})
    needs: gate
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    # Every artifact the assemble job collects is downloaded by exact name, one per matrix cell.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-24.04, image: "ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b" }
          - { distro: ubuntu-26.04, image: "ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db" }
          - { distro: debian-12, image: "debian:12@sha256:1d04200c2ece1d4d75a2a6f8e11ebce7d86a2ae28b34bb2c9cbb3ee9f4953e75" }
          - { distro: debian-13, image: "debian:13@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2" }
    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential clang libclang-dev pkg-config dpkg-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev libfontconfig1-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install rustup (pinned) and the pinned toolchain
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          rustup toolchain install
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - name: Build hx-desktop
        # Only the app's bin, no features, no --all-targets: its dev-dependency on hx-agent's own
        # test features is never built.
        run: cargo build --release --locked -p hx-desktop --bin hx-desktop
      - name: Build the .deb
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SDE: ${{ needs.gate.outputs.sde }}
          DISTRO: ${{ matrix.distro }}
        run: |
          sh packaging/hx-desktop/build-deb.sh --version "$VERSION" --distro "$DISTRO" \
            --bin target/release/hx-desktop --out "out/$DISTRO" --source-date-epoch "$SDE"
          dpkg-deb -I "out/$DISTRO/hx-desktop.deb"
          dpkg-deb -c "out/$DISTRO/hx-desktop.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-deb-${{ matrix.distro }}
          path: out/${{ matrix.distro }}/hx-desktop.deb
          if-no-files-found: error

  desktop-deb-smoke:
    name: hx-desktop .deb smoke test (${{ matrix.distro }})
    needs: [gate, desktop-deb]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-24.04, image: "ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b" }
          - { distro: ubuntu-26.04, image: "ubuntu:26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db" }
          - { distro: debian-12, image: "debian:12@sha256:1d04200c2ece1d4d75a2a6f8e11ebce7d86a2ae28b34bb2c9cbb3ee9f4953e75" }
          - { distro: debian-13, image: "debian:13@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2" }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-deb-${{ matrix.distro }}
      - name: Install in a clean container and resolve every library
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ./hx-desktop.deb
          ldd /usr/bin/hx-desktop
          if ldd /usr/bin/hx-desktop | grep -q 'not found'; then echo "::error::unresolved library in hx-desktop"; exit 1; fi
          test "$(stat -c '%U:%G %a' /usr/bin/hx-desktop)" = "root:root 755"
      - name: Install Xvfb and git, check out the smoke scripts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get install -y --no-install-recommends xvfb xauth ca-certificates git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run the installed app headless (--version, then --demo under Xvfb)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: sh packaging/hx-desktop/smoke-run.sh "$VERSION" hx-desktop

  desktop-appimage:
    name: hx-desktop AppImage
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Install build dependencies
        # Built on 24.04, the oldest supported glibc; it bundles this FFmpeg 6.1.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev libfontconfig1-dev xvfb xauth \
            libegl1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libx11-6 libxcb1
      - name: Build hx-desktop
        run: cargo build --release --locked -p hx-desktop --bin hx-desktop
      - name: Build the AppImage (tools downloaded and verified against appimage-tools.lock)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SDE: ${{ needs.gate.outputs.sde }}
        run: |
          sh packaging/hx-desktop/build-appimage.sh --version "$VERSION" --bin target/release/hx-desktop \
            --out out --tools-dir "$RUNNER_TEMP/appimage-tools" --source-date-epoch "$SDE"
          ls -l out
      - name: Smoke test (extract, files, libraries, --version, --demo under Xvfb)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: sh packaging/hx-desktop/smoke-appimage.sh "out/hx-desktop-$VERSION-x86_64.AppImage" "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-appimage
          path: out/*.AppImage
          if-no-files-found: error

  dry-run:
    name: Dry run (test key, nothing published)
    if: needs.gate.outputs.dry_run == 'true'
    needs: [gate, agent, session-smoke, desktop-deb-smoke, desktop-appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-bins
          path: in/agent
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: session-*
          path: in/session
      - name: Build a test-keyed release dir and prove install.sh accepts it
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          CHANNEL: ${{ needs.gate.outputs.channel }}
          SDE: ${{ needs.gate.outputs.sde }}
        run: |
          set -eu
          # in/session/session-<distro>/hx-session.deb -> <dir>/<distro>/hx-session.deb
          mkdir sessions
          for d in in/session/session-*; do
            n=${d#in/session/session-}
            mkdir "sessions/$n"
            cp "$d/hx-session.deb" "sessions/$n/"
          done
          sh release/make-test-release.sh --out dist --version "$VERSION" --channel "$CHANNEL" \
            --bin-dir in/agent --session-dir sessions
          sh release/verify-with-installer.sh dist/install.sh dist/manifest-x86_64.json dist/manifest-x86_64.json.minisig
          rm -rf dist/private
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dry-run-release-dir
          path: dist
          if-no-files-found: error

  assemble:
    name: Assemble the tarball
    if: needs.gate.outputs.dry_run != 'true'
    needs: [gate, agent, session-smoke, desktop-deb-smoke, desktop-appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-bins
          path: in/agent
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: session-ubuntu-24.04
          path: in/session/session-ubuntu-24.04
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: session-ubuntu-26.04
          path: in/session/session-ubuntu-26.04
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: session-debian-12
          path: in/session/session-debian-12
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: session-debian-13
          path: in/session/session-debian-13
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-deb-ubuntu-24.04
          path: in/desktop/desktop-deb-ubuntu-24.04
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-deb-ubuntu-26.04
          path: in/desktop/desktop-deb-ubuntu-26.04
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-deb-debian-12
          path: in/desktop/desktop-deb-debian-12
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-deb-debian-13
          path: in/desktop/desktop-deb-debian-13
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-appimage
          path: in/desktop/desktop-appimage
      - name: Collect the desktop packages
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -eu
          mkdir desktop
          for n in ubuntu-24.04 ubuntu-26.04 debian-12 debian-13; do
            cp "in/desktop/desktop-deb-$n/hx-desktop.deb" "desktop/hx-desktop_${VERSION}_${n}_amd64.deb"
          done
          cp in/desktop/desktop-appimage/*.AppImage desktop/
          for n in ubuntu-24.04 ubuntu-26.04 debian-12 debian-13; do
            [ -f "desktop/hx-desktop_${VERSION}_${n}_amd64.deb" ] || { echo "::error::the $n hx-desktop .deb is missing"; exit 1; }
          done
          [ -f "desktop/hx-desktop-${VERSION}-x86_64.AppImage" ] || { echo "::error::the AppImage is missing"; exit 1; }
          ls -l desktop
      - name: Assemble (deterministic ustar tarball, at most 256 MiB)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          SDE: ${{ needs.gate.outputs.sde }}
        run: |
          set -eu
          mkdir sessions debs dist
          for d in in/session/session-*; do
            n=${d#in/session/session-}
            mkdir "sessions/$n"
            cp "$d/hx-session.deb" "sessions/$n/"
            cp "$d/hx-session.deb" "debs/hx-session_${n}_${VERSION}.deb"
          done
          sh release/assemble.sh --version "$VERSION" --bin-dir in/agent --session-dir sessions \
            --out dist --source-date-epoch "$SDE"
          cp installer/install.sh dist/install.sh
      - name: Manifest
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          CHANNEL: ${{ needs.gate.outputs.channel }}
        run: |
          set -eu
          # Written here, in a job without secrets, so that the signing job runs no workspace script.
          # The timestamp is this job's clock; privd needs it only to grow from release to release.
          sh release/manifest.sh --version "$VERSION" --channel "$CHANNEL" \
            --artifact "dist/hx-$VERSION-x86_64.tar.gz" --timestamp "$(date +%s)" \
            --out dist/manifest-x86_64.json
          cat dist/manifest-x86_64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assembled
          path: |
            dist
            debs
            desktop
          if-no-files-found: error

  sign:
    name: Sign
    needs: [gate, assemble]
    runs-on: ubuntu-24.04
    environment: release-signing
    # The ONLY job with the signing secrets. It checks out nothing and runs nothing from the
    # workspace or from a build: it downloads the assembled files, installs minisign from the
    # distribution, signs, and uploads. The shipped signature is checked by the secret-free
    # `verify` job.
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: assembled
          path: assembled
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - name: Sign the manifest and install.sh
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
          VERSION: ${{ needs.gate.outputs.version }}
          CHANNEL: ${{ needs.gate.outputs.channel }}
        run: |
          set -eu
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          # a prehashed (ED) signature, the minisign default; the password goes in on stdin
          printf '%s\n' "$MINISIGN_KEY_PASSWORD" | minisign -S -s "$key" \
            -m assembled/dist/manifest-x86_64.json \
            -x assembled/dist/manifest-x86_64.json.minisig \
            -t "hx-manifest v$VERSION channel=$CHANNEL arch=x86_64"
          printf '%s\n' "$MINISIGN_KEY_PASSWORD" | minisign -S -s "$key" \
            -m assembled/dist/install.sh \
            -x assembled/dist/install.sh.minisig \
            -t "hx-install.sh v$VERSION"
      - name: Sign the desktop packages
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -eu
          umask 077
          key="$RUNNER_TEMP/minisign-desktop.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          for f in assembled/desktop/*; do
            printf '%s\n' "$MINISIGN_KEY_PASSWORD" | minisign -S -s "$key" -m "$f" -x "$f.minisig" \
              -t "hx-desktop v$VERSION $(basename "$f")"
          done
          ls -l assembled/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed
          path: |
            assembled/dist
            assembled/debs
            assembled/desktop
          if-no-files-found: error

  verify:
    name: Verify the signed release (no secrets)
    needs: [gate, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed
          path: signed
      - name: The shipped install.sh must accept the shipped signature
        run: |
          sh release/verify-with-installer.sh signed/dist/install.sh \
            signed/dist/manifest-x86_64.json signed/dist/manifest-x86_64.json.minisig
          cmp installer/install.sh signed/dist/install.sh

  attest:
    name: Attest (audit only)
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed
          path: signed
      # Audit only: no server verifies these (no gh or Sigstore client on the host).
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            signed/dist/*.tar.gz
            signed/dist/manifest-x86_64.json
            signed/dist/install.sh
            signed/debs/*.deb
            signed/desktop/*.deb
            signed/desktop/*.AppImage

  publish:
    name: Publish
    needs: [gate, verify, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed
          path: signed
      - name: Create the version release, then move the channel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          CHANNEL: ${{ needs.gate.outputs.channel }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          d=signed/dist
          # Refuse unless this version is strictly newer than the one the channel serves now (a
          # re-run of an old tag, or an older tag, must not roll the channel back). No channel
          # release yet = the first release of the channel. Only runner-image tools run here.
          vkey() { # <version> -> a sortable key (alpha < beta < rc < final)
            printf '%s\n' "$1" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$/\1 \2 \3 \5 \6/' |
              awk '{ r = ($4 == "alpha") ? 1 : ($4 == "beta") ? 2 : ($4 == "rc") ? 3 : 9; printf "%05d%05d%05d%d%05d\n", $1, $2, $3, r, $5 }'
          }
          if gh release view "channel-$CHANNEL" --repo "$REPO" >/dev/null 2>&1; then
            mkdir current
            gh release download "channel-$CHANNEL" --repo "$REPO" --dir current --pattern manifest-x86_64.json
            cur=$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' current/manifest-x86_64.json | head -n 1)
            if ! printf '%s\n' "$cur" | grep -Eq '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}(-(alpha|beta|rc)\.[0-9]{1,4})?$'; then
              echo "::error::cannot read the current version of channel-$CHANNEL"
              exit 1
            fi
            if [ "$(vkey "$VERSION")" \< "$(vkey "$cur")" ] || [ "$(vkey "$VERSION")" = "$(vkey "$cur")" ]; then
              echo "::error::$VERSION is not newer than $cur, the current $CHANNEL release: refusing to publish"
              exit 1
            fi
            echo "$VERSION is newer than $cur"
          else
            echo "::notice::no channel-$CHANNEL release yet: first release of the channel"
          fi
          pre=''
          [ "$CHANNEL" = beta ] && pre='--prerelease'
          # The version release goes first, so the manifest never points at a missing artifact.
          # the desktop packages (.deb per distro, AppImage) and their .minisig files ride along
          set -- "$d/hx-$VERSION-x86_64.tar.gz" "$d/install.sh" "$d/install.sh.minisig" \
            "$d/manifest-x86_64.json" "$d/manifest-x86_64.json.minisig"
          for f in signed/desktop/*; do set -- "$@" "$f"; done
          gh release create "v$VERSION" --repo "$REPO" --target "$SHA" --title "v$VERSION" \
            --notes "hash-xcreen $VERSION ($CHANNEL channel). Install: see the README." $pre "$@"
          # The moving channel release: what the one-liner and privd's fetcher read.
          if ! gh release view "channel-$CHANNEL" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "channel-$CHANNEL" --repo "$REPO" --target "$SHA" --prerelease --latest=false \
              --title "channel-$CHANNEL" --notes "Moving release: the current $CHANNEL manifest and install.sh."
          fi
          gh release upload "channel-$CHANNEL" --repo "$REPO" --clobber \
            "$d/manifest-x86_64.json" "$d/manifest-x86_64.json.minisig" "$d/install.sh" "$d/install.sh.minisig"
