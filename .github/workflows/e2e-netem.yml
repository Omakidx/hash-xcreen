name: End-to-end under netem

# The whole flow (pair, PIN login, connect, type, scroll, idle, disconnect, reconnect) once per
# network profile: LAN, broadband, lossy, mobile-ish. The network is two network namespaces joined
# by a veth pair with `tc netem` on both ends, made unprivileged with `unshare -rn`, and each
# profile is measured (ping RTT, ping loss, UDP rate) before the flow runs. A hosted runner is a
# shared machine: the thresholds are the functional ones (it works, it recovers, it does not
# stall, LAN latency at 4x the Gate 1 number). The strict Gate 1 numbers are checked by perf.yml on the dedicated runner.

on:
  push:
    branches: [main]
    paths:
      - "apps/hx-agent/**"
      - "apps/hx-session/**"
      - "crates/**"
      - "perf/**"
      - ".github/workflows/e2e-netem.yml"
  pull_request:
    paths:
      - "apps/hx-agent/**"
      - "apps/hx-session/**"
      - "crates/**"
      - "perf/**"
      - ".github/workflows/e2e-netem.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-netem-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  netem:
    name: Netem profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Install system libraries, Xvfb and the network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libx264-dev xvfb iproute2 iputils-ping util-linux
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts them with AppArmor by default. The test itself never uses root:
        # this only lifts the restriction on this throwaway VM.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-nextest
      - name: Build hx-session next to the gateway binary
        run: cargo build --release --locked -p hx-session --bin hx-session
      - name: The impairment is real (ping RTT, loss, jitter, UDP rate on the veth)
        env:
          HX_E2E_NETEM: "1"
          HX_REQUIRE_XVFB: "1"
        run: >
          cargo nextest run --release --locked -p hx-agent --test e2e_netem --run-ignored only --no-capture
          --no-tests=fail -E 'test(netem_control_proves_the_impairment_applies)'
      - name: The flow under LAN, broadband and mobile
        env:
          HX_E2E_NETEM: "1"
          HX_REQUIRE_XVFB: "1"
          HX_NETEM_PROFILES: lan,broadband,mobile
          HX_NETEM_OUT: ${{ runner.temp }}/netem
        run: >
          cargo nextest run --release --locked -p hx-agent --test e2e_netem --run-ignored only --no-capture
          --no-tests=fail -E 'test(netem_e2e_over_all_profiles)'
      - name: The flow under the lossy profile
        # 1.5 % loss each way at 40 ms RTT; the picture must end exact (docs/testing.md 2.8
        # records the defect this step caught and its fix). A separate step so that its log and
        # artifact are easy to find.
        env:
          HX_E2E_NETEM: "1"
          HX_REQUIRE_XVFB: "1"
          HX_NETEM_PROFILES: lossy
          HX_NETEM_LOGS: "1"
          HX_NETEM_OUT: ${{ runner.temp }}/netem-lossy
        run: >
          cargo nextest run --release --locked -p hx-agent --test e2e_netem --run-ignored only --no-capture
          --no-tests=fail -E 'test(netem_e2e_over_all_profiles)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() }}
        with:
          name: netem-results
          path: |
            ${{ runner.temp }}/netem
            ${{ runner.temp }}/netem-lossy
          if-no-files-found: ignore
