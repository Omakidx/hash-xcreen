# Ubuntu 26.04 (resolute). Same snap-shim problem as 24.04, same Mozilla Team PPA (the PPA,
# Docker and VS Code repositories all publish a `resolute` suite as of 2026-11).
# Not yet build-tested end to end (S3 only ran 26.04 as the host); the CI equivalence check
# and the prebuilt image CI are the first full runs.
[recipe]
base_image = "images:ubuntu/26.04"

[vars]
distro = "ubuntu"
codename = "resolute"
distro_version = "26.04"
# FFmpeg runtime of the hx-session .deb: its Depends (dpkg-shlibdeps) names exactly these
# sonames, and privd's InstallSession runs `dpkg -i`, which resolves nothing. FFmpeg 8.0.1, 7:8.0.1-3ubuntu2 (packages.ubuntu.com, resolute, checked 2026-11-21).
# packaging/hx-session/check-recipe-covers-depends.sh keeps them in step with the .deb.
libavcodec_pkg = "libavcodec62"
libavutil_pkg = "libavutil60"

# The PPA's signing key as reported by the Launchpad API (signing_key_fingerprint of
# ~mozillateam/+archive/ubuntu/ppa). Its Release files are signed by this key and by the older
# 0AB21567... key, but apt on 26.04 rejects the old one (rsa1024). The recipe step fails unless the
# downloaded file holds exactly one primary key with this fingerprint.
[[apt_repo]]
name = "mozillateam"
key_url = "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x738BEB9321D1AAEC13EA9391AEBDF4819BE21867"
key_fingerprint = "738BEB9321D1AAEC13EA9391AEBDF4819BE21867"
uri = "https://ppa.launchpadcontent.net/mozillateam/ppa/ubuntu"
suite = "{{codename}}"
components = "main"
pin = '''
Package: firefox*
Pin: release o=LP-PPA-mozillateam
Pin-Priority: 1001
'''

[apt]
packages = ["firefox"]
