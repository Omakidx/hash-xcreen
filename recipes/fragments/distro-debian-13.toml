# Debian 13 (trixie). Firefox ESR is a normal deb here.
# The Incus compatibility rule (raw.apparmor "signal,") that Debian 13 guests need on newer
# host kernels is not part of the recipe: it is instance configuration and lives in the hx
# Incus profile (hx-provision's `profiles` module), because prebuilt images carry no instance config.
[recipe]
base_image = "images:debian/13"

[vars]
distro = "debian"
codename = "trixie"
distro_version = "13"
# FFmpeg runtime of the hx-session .deb: its Depends (dpkg-shlibdeps) names exactly these
# sonames, and privd's InstallSession runs `dpkg -i`, which resolves nothing. FFmpeg 7.1.5, 7:7.1.5-0+deb13u1 (packages.debian.org, trixie, checked 2026-11-21).
# packaging/hx-session/check-recipe-covers-depends.sh keeps them in step with the .deb.
libavcodec_pkg = "libavcodec61"
libavutil_pkg = "libavutil59"

[apt]
packages = ["firefox-esr"]
