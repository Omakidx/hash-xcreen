# Debian 12 (bookworm). Firefox ESR is a normal deb here.
[recipe]
base_image = "images:debian/12"

[vars]
distro = "debian"
codename = "bookworm"
distro_version = "12"
# FFmpeg runtime of the hx-session .deb: its Depends (dpkg-shlibdeps) names exactly these
# sonames, and privd's InstallSession runs `dpkg -i`, which resolves nothing. FFmpeg 5.1.9, 7:5.1.9-0+deb12u1 (packages.debian.org, bookworm, checked 2026-11-21).
# packaging/hx-session/check-recipe-covers-depends.sh keeps them in step with the .deb.
libavcodec_pkg = "libavcodec59"
libavutil_pkg = "libavutil57"

[apt]
packages = ["firefox-esr"]
