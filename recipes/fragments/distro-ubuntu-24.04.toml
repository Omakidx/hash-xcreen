# Ubuntu 24.04 (noble). Ubuntu's firefox/chromium packages are snap shims, which do not work
# well in an unprivileged container, so Firefox comes from the Mozilla Team PPA (deb). The
# official packages.mozilla.org repository is IPv4-only (S3: containers with IPv6-only egress
# could not reach it); Launchpad is dual-stack.
[recipe]
base_image = "images:ubuntu/24.04"

[vars]
distro = "ubuntu"
codename = "noble"
distro_version = "24.04"
# FFmpeg runtime of the hx-session .deb: its Depends (dpkg-shlibdeps) names exactly these
# sonames, and privd's InstallSession runs `dpkg -i`, which resolves nothing. FFmpeg 6.1, verified on a 24.04 host (spike 1c-e2e).
# packaging/hx-session/check-recipe-covers-depends.sh keeps them in step with the .deb.
libavcodec_pkg = "libavcodec60"
libavutil_pkg = "libavutil58"

[[apt_repo]]
name = "mozillateam"
key_url = "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0AB215679C571D1C8325275B9BDB3D89CE49EC21"
key_fingerprint = "0AB215679C571D1C8325275B9BDB3D89CE49EC21"
uri = "https://ppa.launchpadcontent.net/mozillateam/ppa/ubuntu"
suite = "{{codename}}"
components = "main"
pin = '''
Package: firefox*
Pin: release o=LP-PPA-mozillateam
Pin-Priority: 1001
'''

[apt]
packages = ["firefox"]
