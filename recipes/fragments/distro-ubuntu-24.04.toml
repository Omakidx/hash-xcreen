# Ubuntu 24.04 (noble). Ubuntu's firefox/chromium packages are snap shims, which do not work
# well in an unprivileged container, so Firefox comes from the Mozilla Team PPA (deb). The
# official packages.mozilla.org repository is IPv4-only (S3: containers with IPv6-only egress
# could not reach it); Launchpad is dual-stack.
[recipe]
base_image = "images:ubuntu/24.04"

[vars]
distro = "ubuntu"
codename = "noble"
distro_version = "24.04"
# FFmpeg runtime of the hx-session .deb: its Depends (dpkg-shlibdeps) names exactly these
# sonames, and privd's InstallSession runs `dpkg -i`, which resolves nothing. FFmpeg 6.1, verified on a 24.04 host (spike 1c-e2e).
# packaging/hx-session/check-recipe-covers-depends.sh keeps them in step with the .deb.
libavcodec_pkg = "libavcodec60"
libavutil_pkg = "libavutil58"

# The PPA's signing key as reported by the Launchpad API (signing_key_fingerprint of
# ~mozillateam/+archive/ubuntu/ppa), as on 26.04: the PPA's Release files are also signed by the
# older 0AB21567... key, which apt 2.8 warns about (rsa1024) and newer apt rejects.
# The second pin stanza: Ubuntu's own `firefox` is a transitional package that installs the snap,
# which cannot work in an unprivileged container. It must never be chosen, also not when the PPA is
# unreachable (then the install fails clearly instead).
[[apt_repo]]
name = "mozillateam"
key_url = "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x738BEB9321D1AAEC13EA9391AEBDF4819BE21867"
key_fingerprint = "738BEB9321D1AAEC13EA9391AEBDF4819BE21867"
uri = "https://ppa.launchpadcontent.net/mozillateam/ppa/ubuntu"
suite = "{{codename}}"
components = "main"
pin = '''
Package: firefox*
Pin: release o=LP-PPA-mozillateam
Pin-Priority: 1001

Package: firefox*
Pin: release o=Ubuntu
Pin-Priority: -1
'''

[apt]
packages = ["firefox"]
