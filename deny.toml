# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licences compatible with distributing hash-xcreen under AGPL-3.0-or-later.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allowlist is policy for future dependencies; do not warn about entries not yet in use.
unused-allowed-license = "allow"

# The FFmpeg bindings are WTFPL, a permissive licence compatible with AGPL distribution.
# Allowed for these two crates only, not as a general policy.
exceptions = [
    { allow = ["WTFPL"], crate = "ffmpeg-next" },
    { allow = ["WTFPL"], crate = "ffmpeg-sys-next" },
]

[licenses.private]
# Our own crates are unpublished (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
