# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licences compatible with distributing hash-xcreen under AGPL-3.0-or-later.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allowlist is policy for future dependencies; do not warn about entries not yet in use.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are unpublished (publish = false).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

# The wire protocol is TLS 1.3 only (docs/protocol.md section 1). rustls's `tls12` feature is not
# compiled in today; this fails CI if any crate in the graph turns it on.
[[bans.features]]
crate = "rustls"
deny = ["tls12"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
