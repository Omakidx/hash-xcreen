// hash-xcreen wire protocol, version 1.2 (1.0 base, 1.1 and 1.2 additive). Normative description:
// docs/protocol.md.
// Field numbers are never reused; adding fields or messages is a minor-version change.
syntax = "proto3";

package hx.v1;

message Version {
  uint32 major = 1;
  uint32 minor = 2;
}

enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_H264 = 1;
  VIDEO_CODEC_AV1 = 2;
  VIDEO_CODEC_H265 = 3;
}

message Capabilities {
  repeated VideoCodec video_codecs = 1;
  uint64 features = 2;
  // 1.1: largest file transfer this side accepts; 0 = not stated; at most 4 GiB.
  uint64 max_file_bytes = 3;
}

enum Intent {
  INTENT_UNSPECIFIED = 0;
  INTENT_SESSION = 1;
  INTENT_PAIR = 2;
}

message Hello {
  Version version = 1;
  Capabilities capabilities = 2;
  Intent intent = 3;
  string software = 4;
  string device_name = 5;
}

message HelloAck {
  Version version = 1;
  Capabilities capabilities = 2;
  bytes session_id = 3;
  string software = 4;
}

enum RefuseReason {
  REFUSE_REASON_UNSPECIFIED = 0;
  REFUSE_REASON_UPDATE_REQUIRED = 1;
  REFUSE_REASON_UNAUTHORIZED = 2;
  REFUSE_REASON_BUSY = 3;
  REFUSE_REASON_PAIRING_CLOSED = 4;
}

message Refuse {
  RefuseReason reason = 1;
  string message = 2;
  Version version = 3;
}

message ViewConfig {
  VideoCodec codec = 1;
  uint32 max_fps = 2;
  uint32 bandwidth_cap_kbps = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 scale_percent = 6;
  bool audio_enabled = 7;
  bool clipboard_enabled = 8;
  // 1.1: send ServerStats (requires the SERVER_STATS feature).
  bool stats_enabled = 9;
}

message StreamInfo {
  VideoCodec codec = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 fps = 4;
  uint32 first_frame = 5;
}

message RequestKeyframe {
  uint32 last_decoded_frame = 1;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

message ClientStats {
  uint32 interval_ms = 1;
  uint32 decoded_frames = 2;
  uint32 dropped_frames = 3;
  uint32 decode_p95_us = 4;
}

message Goodbye {
  uint32 code = 1;
  string message = 2;
  // 1.1, only with close code TAKEN_OVER: the new device's sanitized name (at most 64 bytes)
  // and its 16-byte device id (empty or 16 bytes).
  string peer_device_name = 3;
  bytes peer_device_id = 4;
}

// 1.1: numeric-only statistics for the stats overlay. No string or bytes field, ever.
message ServerStats {
  uint32 interval_ms = 1;
  uint32 frames = 2;
  uint32 keyframes = 3;
  uint32 dropped_frames = 4;
  uint32 bitrate_kbps = 5;
  uint32 target_bitrate_kbps = 6;
  uint32 fps_ceiling = 7;
  uint32 encode_p95_us = 8;
  uint32 total_p95_us = 9;
  uint32 queue_depth_max = 10;
  uint32 rtt_us = 11;
}

// ----- 1.2: device management (protocol 5.9) -----

enum DeviceStatus {
  DEVICE_STATUS_UNSPECIFIED = 0;
  DEVICE_STATUS_ACTIVE = 1;
  DEVICE_STATUS_REVOKED = 2;
}

enum DeviceRevokeReason {
  DEVICE_REVOKE_REASON_UNSPECIFIED = 0;
  // An operator or another paired device revoked it.
  DEVICE_REVOKE_REASON_USER = 1;
  // The PIN was wrong too many times.
  DEVICE_REVOKE_REASON_TOO_MANY_PIN_FAILURES = 2;
}

message DeviceInfo {
  // 16 bytes (protocol 11.1).
  bytes device_id = 1;
  // Sanitised label chosen by the device at pairing, at most 64 bytes. Display as plain text.
  string name = 2;
  uint64 created_unix = 3;
  // 0 = never connected.
  uint64 last_seen_unix = 4;
  DeviceStatus status = 5;
  // Set only when status is REVOKED.
  DeviceRevokeReason revoke_reason = 6;
  // Set only when status is REVOKED.
  uint64 revoked_unix = 7;
  // True for the device that asked (in DeviceList), so a client can mark "this device".
  bool current = 8;
}

message ListDevices {}

message DeviceList {
  // At most 128, active devices first, then revoked ones, newest first within each.
  repeated DeviceInfo devices = 1;
  // True if there were more devices than fit.
  bool truncated = 2;
}

message RevokeDevice {
  bytes device_id = 1;
}

enum RevokeStatus {
  REVOKE_STATUS_UNSPECIFIED = 0;
  REVOKE_STATUS_OK = 1;
  REVOKE_STATUS_NOT_FOUND = 2;
  REVOKE_STATUS_ALREADY_REVOKED = 3;
  // Would leave the server with no active device (only possible for a self-revoke).
  REVOKE_STATUS_LAST_ACTIVE_DEVICE = 4;
  REVOKE_STATUS_RATE_LIMITED = 5;
  REVOKE_STATUS_FAILED = 6;
}

message RevokeResult {
  RevokeStatus status = 1;
}

enum DeviceEventKind {
  DEVICE_EVENT_KIND_UNSPECIFIED = 0;
  DEVICE_EVENT_KIND_ADDED = 1;
  DEVICE_EVENT_KIND_REVOKED = 2;
  DEVICE_EVENT_KIND_REINSTATED = 3;
}

// Pushed to every live session that negotiated DEVICE_MANAGEMENT when the device registry
// changes (request_id 0).
message DeviceEvent {
  DeviceEventKind kind = 1;
  DeviceInfo device = 2;
  // The device that caused it: empty (operator, PIN lockout, or the server), or 16 bytes.
  bytes by_device_id = 3;
}

message DeviceMgmt {
  // Non-zero in a request and in the response that answers it; 0 only in a DeviceEvent.
  uint32 request_id = 1;
  oneof body {
    ListDevices list = 10;           // client to server
    DeviceList device_list = 11;     // server to client
    RevokeDevice revoke = 12;        // client to server
    RevokeResult revoke_result = 13; // server to client
    DeviceEvent event = 14;          // server to client
  }
}

// Opaque carrier for messages owned by workstream 1B (pairing, PIN/auth).
message Opaque {
  bytes data = 1;
}

message ControlMessage {
  oneof message {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    Refuse refuse = 3;
    ViewConfig view_config = 4;
    StreamInfo stream_info = 5;
    RequestKeyframe request_keyframe = 6;
    Ping ping = 7;
    Pong pong = 8;
    ClientStats stats = 9;
    Goodbye goodbye = 10;
    ServerStats server_stats = 11;
    // 1.2, feature DEVICE_MANAGEMENT: list and revoke paired devices (protocol 5.9).
    DeviceMgmt device_mgmt = 12;
    Opaque pairing = 100;
    Opaque auth = 101;
  }
}

enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
  MOUSE_BUTTON_MIDDLE = 3;
  MOUSE_BUTTON_BACK = 4;
  MOUSE_BUTTON_FORWARD = 5;
}

message KeyEvent {
  uint32 scancode = 1;
  bool pressed = 2;
}

message ButtonEvent {
  MouseButton button = 1;
  bool pressed = 2;
  sint32 x = 3;
  sint32 y = 4;
}

message ScrollEvent {
  sint32 dx = 1;
  sint32 dy = 2;
}

message ReleaseAll {}

message InputEvent {
  oneof event {
    KeyEvent key = 1;
    ButtonEvent button = 2;
    ScrollEvent scroll = 3;
    ReleaseAll release_all = 4;
  }
}

message CursorShape {
  uint64 id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 hotspot_x = 4;
  uint32 hotspot_y = 5;
  bytes rgba = 6;
}

message CursorPosition {
  sint32 x = 1;
  sint32 y = 2;
  uint64 shape_id = 3;
  bool visible = 4;
}

message CursorEvent {
  oneof event {
    CursorShape shape = 1;
    CursorPosition position = 2;
  }
}

message TransferHeader {
  string mime = 1;
  string name = 2;
  uint64 size = 3;
}
