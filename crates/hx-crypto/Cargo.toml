[package]
name = "hx-crypto"
description = "Identity and device keys, SPAKE2 pairing, PIN and password hashing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Entry points for the cargo-fuzz targets in `fuzz/` (module `fuzz`). Never enabled by a build of the
# product: only the `fuzz` crate switches it on.
fuzzing = []

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
bytes = "1"
ed25519-dalek = "2"
getrandom = "0.4"
hmac = "0.12"
hx-proto = { version = "0.1.0", path = "../hx-proto" }
hx-transport = { version = "0.1.0", path = "../hx-transport" }
prost = "0.14"
rustix = { workspace = true, features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
spake2 = "0.4"
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
zeroize = "1.9.2"

[dev-dependencies]
proptest = "1"
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
