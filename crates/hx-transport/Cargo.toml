[package]
name = "hx-transport"
description = "QUIC and WebSocket-over-TLS transports behind one channel API, plus the ALPN dispatch for later WebTransport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hx-proto = { version = "0.1.0", path = "../hx-proto" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30"
tracing = "0.1"

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }

[lints]
workspace = true
