[package]
name = "hx-provision"
description = "Declarative desktop recipes and Incus orchestration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync"] }
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = { version = "0.1", features = ["channel"] }
bytes = "1"
zeroize.workspace = true

[features]
# Constructors that exist only for tests (an unchecked mount, a link in another directory). Enabled
# for this crate's own tests through the self dev-dependency below; never by a production crate.
test-support = []

[dev-dependencies]
# Tests always build with the test-only constructors, also in `cargo nextest run --workspace`.
hx-provision = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
