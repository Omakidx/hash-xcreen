[package]
name = "hx-capture"
description = "Screen capture and input injection backends (X11 first)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crossbeam-channel.workspace = true
rustix = { workspace = true, features = ["event", "fs", "mm", "time"] }
thiserror.workspace = true
x11rb = { workspace = true, features = ["damage", "randr", "shm", "xfixes", "xinput", "xtest"] }

[dev-dependencies]
x11rb = { workspace = true, features = ["xtest"] }
