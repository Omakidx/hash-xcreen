[package]
name = "hx-backup"
description = "Full-desktop backups to Google Drive with rustic_core: scheduling, retention, verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `engine` links rustic_core. Consumers that only need the rules and the manifest (hx-privd) use
# `default-features = false`.
default = ["engine"]
engine = ["dep:rustic_core", "dep:zeroize", "dep:tracing"]

[dependencies]
rustic_core = { workspace = true, optional = true }
jiff = { version = "0.2", default-features = false, features = ["std"] }
globset.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tracing = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
bytes.workspace = true
# The local backend, for offline integration tests (no `opendal`, `rest` or `rclone`).
rustic_backend = { version = "=0.8.0", default-features = false }
proptest = "1"
tempfile = "3.27.0"
