[package]
name = "hx-backup"
description = "Full-desktop backups to Google Drive with rustic_core: scheduling, retention, verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The default build is pure (rules, manifest; no rustic), which is what hx-privd uses. `engine` links
# rustic_core and is enabled only by the backup worker (ipc.md §36).
default = []
engine = ["dep:rustic_core", "dep:zeroize", "dep:tracing"]

[dependencies]
rustic_core = { workspace = true, optional = true }
jiff = { version = "0.2", default-features = false, features = ["std"] }
globset.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tracing = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
# Tests always build with the engine, also in `cargo nextest run --workspace` where nothing else enables it.
hx-backup = { path = ".", features = ["engine"] }
bytes.workspace = true
# The local backend, for offline integration tests (no `opendal`, `rest` or `rclone`).
rustic_backend = { version = "=0.8.0", default-features = false }
proptest = "1"
tempfile = "3.27.0"
