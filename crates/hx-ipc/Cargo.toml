[package]
name = "hx-ipc"
description = "Internal IPC: framing and message schemas for hx-privd, the hx-gatewayd admin socket and the session link."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["privd", "link"]
# The hx-privd command set and the hx-gatewayd admin socket (docs/ipc.md Part 1 and section 9):
# schemas, framing, secret frames, SO_PEERCRED. Not needed by hx-session.
privd = ["dep:prost"]
# The session link (docs/ipc.md Part 2): schemas, preamble, lanes, budgets. Needs the shared
# hx.v1 types, hence hx-proto.
link = ["dep:hx-proto", "dep:prost"]
# The repository link (docs/ipc.md Part 3): schema, framing kinds 1 to 3, data frames, secret
# frames, limits, link state and the operation policy. Not in `default`: the musl backup worker
# builds with `default-features = false, features = ["repo"]`, and hx-privd enables it explicitly.
repo = ["dep:prost"]

[dependencies]
bytes.workspace = true
hx-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
rustix = { workspace = true, features = ["net"] }
thiserror.workspace = true
zeroize.workspace = true

[build-dependencies]
# Pure-Rust protobuf compiler, as in hx-proto: no `protoc` binary needed.
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
# Switches `repo` on for this crate's own tests: nothing else in the workspace depends on the
# feature yet, and the repository link tests must run in a plain `cargo test --workspace`.
hx-ipc = { path = ".", default-features = false, features = ["repo"] }
criterion.workspace = true
proptest = "1"

[[bench]]
name = "link"
harness = false
required-features = ["link"]

[lints]
workspace = true
