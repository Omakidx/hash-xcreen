// Session link control and bulk messages (docs/ipc.md sections 14, 16).
//
// Content that is identical to the client protocol reuses the hx.v1 types (InputEvent,
// CursorEvent, ClientStats, TransferHeader, VideoCodec) so field semantics are defined once.
syntax = "proto3";

package hx.link.v1;

import "hx.proto";

// ----- shared -----

message StreamConfig {
  hx.v1.VideoCodec codec = 1;
  // 0 (keep or default) or 1 to 240.
  uint32 max_fps = 2;
  // 0 = auto; otherwise 100 to 100 000.
  uint32 bitrate_cap_kbps = 3;
  // Both 0 (keep) or each 1 to 16 384.
  uint32 width = 4;
  uint32 height = 5;
  // 0 (= 100) or 50 to 400.
  uint32 scale_percent = 6;
  // Reserved: requires the AUDIO feature.
  bool audio_enabled = 7;
  bool clipboard_enabled = 8;
  bool file_transfer_enabled = 9;
}

enum FrameOutcome {
  FRAME_OUTCOME_UNSPECIFIED = 0;
  FRAME_OUTCOME_DELIVERED = 1;
  FRAME_OUTCOME_CANCELLED = 2;
  FRAME_OUTCOME_REJECTED = 3;
  // Gateway only: discarded without starting to send.
  FRAME_OUTCOME_DROPPED = 4;
}

message FrameResult {
  uint32 frame_number = 1;
  FrameOutcome outcome = 2;
  uint32 bytes = 3;
  uint32 elapsed_us = 4;
  uint32 queued_us = 5;
}

// ----- gateway to session -----

message Start {
  uint32 epoch = 1;
  StreamConfig config = 2;
}

message Stop {
  uint32 epoch = 1;
}

message Reconfigure {
  StreamConfig config = 1;
}

message RequestIdr {
  uint32 epoch = 1;
  uint32 last_decoded_frame = 2;
}

message Mouse {
  uint32 seq = 1;
  bool relative = 2;
  sint32 x = 3;
  sint32 y = 4;
}

message FrameFeedback {
  // At most 64.
  repeated FrameResult results = 1;
}

message TransportStats {
  uint32 rtt_us = 1;
  uint32 delivery_rate_kbps = 2;
}

message Ping {
  uint64 nonce = 1;
}

message Goodbye {
  // A protocol.md section 8 close code.
  uint32 code = 1;
  // At most 256 bytes; log only.
  string message = 2;
}

message GatewayToSession {
  oneof message {
    Start start = 1;
    Stop stop = 2;
    Reconfigure reconfigure = 3;
    RequestIdr request_idr = 4;
    hx.v1.InputEvent input = 5;
    Mouse mouse = 6;
    FrameFeedback frame_feedback = 7;
    TransportStats transport_stats = 8;
    hx.v1.ClientStats client_stats = 9;
    Ping ping = 10;
    Goodbye goodbye = 11;
  }
}

// ----- session to gateway -----

message Display {
  uint32 width = 1;
  uint32 height = 2;
}

message Info {
  // At most 128 bytes; log only.
  string software = 1;
  // Bit 0 AUDIO, 1 CLIPBOARD, 2 FILE_TRANSFER, 8 INPUT, 9 RESIZE.
  uint64 features = 2;
  // At most 4.
  repeated hx.v1.VideoCodec codecs = 3;
  Display display = 4;
  uint32 max_fps = 5;
}

message StreamFormat {
  uint32 epoch = 1;
  hx.v1.VideoCodec codec = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 fps = 5;
  uint32 first_frame = 6;
}

message CancelFrames {
  uint32 up_to_frame = 1;
}

// Interval values (ipc.md section 14.2).
message SessionStats {
  uint32 interval_ms = 1;
  uint32 captures = 2;
  uint32 frames = 3;
  uint32 keyframes = 4;
  uint32 idr_frames = 5;
  uint64 bytes = 6;
  uint32 max_frame_bytes = 7;
  uint32 errors = 8;
  uint32 capture_buffer_waits = 9;
  uint32 encode_p50_us = 10;
  uint32 encode_p95_us = 11;
  uint32 total_p95_us = 12;
  uint32 cpu_ms = 13;
  uint32 target_bitrate_kbps = 14;
  uint32 fps_ceiling = 15;
  uint32 queue_depth_max = 16;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_FATAL = 1;
  EVENT_KIND_DISPLAY_CHANGED = 2;
  EVENT_KIND_CAPTURE_ERROR = 3;
  EVENT_KIND_CLIPBOARD_ERROR = 4;
  EVENT_KIND_RESIZE_REFUSED = 5;
}

message Event {
  EventKind kind = 1;
  // At most 256 bytes; log only.
  string message = 2;
}

message Pong {
  uint64 nonce = 1;
}

message SessionToGateway {
  oneof message {
    Info info = 1;
    StreamFormat stream_format = 2;
    hx.v1.CursorEvent cursor = 3;
    CancelFrames cancel_frames = 4;
    SessionStats stats = 5;
    Event event = 6;
    Pong pong = 7;
    Goodbye goodbye = 8;
  }
}

// ----- bulk lane -----

enum TransferChannel {
  TRANSFER_CHANNEL_UNSPECIFIED = 0;
  // Protocol channel 0x07.
  TRANSFER_CHANNEL_CLIPBOARD = 1;
  // Protocol channel 0x08.
  TRANSFER_CHANNEL_FILE = 2;
}

// Body of a bulk kind 0x20 frame. The gateway allocates odd ids, the session even ids.
message TransferOpen {
  uint32 id = 1;
  TransferChannel channel = 2;
  hx.v1.TransferHeader header = 3;
}
