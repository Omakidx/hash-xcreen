# Ubuntu 24.04 specifics. Ubuntu's firefox/chromium packages are snap shims, which
# do not work well in an unprivileged container, so Firefox comes from the Mozilla Team
# PPA (deb). The official packages.mozilla.org repo is IPv4-only; the spike host's
# containers only had IPv6 egress, and Launchpad is dual-stack, so the PPA is used.
[recipe]
base_image = "images:ubuntu/24.04"

[vars]
distro = "ubuntu"
codename = "noble"

[[apt_repo]]
name = "mozillateam"
key_url = "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0AB215679C571D1C8325275B9BDB3D89CE49EC21"
key_fingerprint = "0AB215679C571D1C8325275B9BDB3D89CE49EC21"
uri = "https://ppa.launchpadcontent.net/mozillateam/ppa/ubuntu"
suite = "{{codename}}"
components = "main"
pin = '''
Package: *
Pin: release o=LP-PPA-mozillateam
Pin-Priority: 1001
'''

[apt]
packages = ["firefox"]
