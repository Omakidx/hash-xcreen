# Preset "developer": basic + VS Code, git, build tools, Claude Code, Codex CLI.
[vars]
preset = "developer"

[[apt_repo]]
name = "vscode"
key_url = "https://packages.microsoft.com/keys/microsoft.asc"
key_fingerprint = "BC528686B50D79E339D3721CEB3E94ADBE1229CF"
uri = "https://packages.microsoft.com/repos/code"
suite = "stable"
components = "main"

# The `code` postinst offers to add Microsoft's repo a second time; we already did.
[[pre_step]]
name = "vscode-debconf"
run = "apt-get install -y -qq debconf-utils >/dev/null; echo 'code code/add-microsoft-repo boolean false' | debconf-set-selections"

[apt]
packages = ["code", "git", "build-essential", "pkg-config", "unzip", "jq", "python3"]

# Vendor installers self-update and need account logins, so the spike does not run them.
# They stay in the recipe (disabled) to show where they go: as the desktop user, post-image.
[[post_step]]
name = "claude-code"
enabled = false
as_user = true
run = "curl -fsSL https://claude.ai/install.sh | bash"

[[post_step]]
name = "codex-cli"
enabled = false
as_user = true
run = "echo 'Codex CLI native installer goes here (vendor installer, pinned URL and checksum)'"
