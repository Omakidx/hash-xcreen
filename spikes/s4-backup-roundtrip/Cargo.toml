[package]
name = "s4-backup-roundtrip"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Spike S4: rustic_core backup/restore round trip"

[workspace]

[dependencies]
rustic_core = { version = "0.14", features = ["clap"] }
rustic_backend = { version = "0.8", default-features = false, features = ["opendal"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
serde_json = "1"
jiff = "0.2"
env_logger = "0.11"

[dev-dependencies]
proptest = "1"
