[workspace]

[package]
name = "s2-streaming-loop"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Spike S2: capture, encode, QUIC, decode loop with per-stage timing (throwaway code)"

[lib]
name = "s2"
path = "src/lib.rs"

[[bin]]
name = "s2-server"
path = "src/bin/server.rs"

[[bin]]
name = "s2-client"
path = "src/bin/client.rs"

[[bin]]
name = "s2-fidelity"
path = "src/bin/fidelity.rs"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
ffmpeg-next = { version = "7.1", default-features = false, features = ["codec", "software-scaling", "format"] }
libc = "0.2"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
x11rb = { version = "0.13", features = ["shm", "damage", "xfixes", "allow-unsafe-code"] }
yuvutils-rs = "0.8"

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
