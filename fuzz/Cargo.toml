[package]
name = "hx-fuzz"
description = "cargo-fuzz targets for the pre-authentication and container-supplied parsers. Not part of the product."
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: cargo-fuzz builds with a nightly toolchain and sanitizer flags that the
# product workspace must never see. The root workspace lists this directory under `exclude`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
hx-agent = { path = "../apps/hx-agent", features = ["fuzzing", "test-support"] }
hx-crypto = { path = "../crates/hx-crypto", features = ["fuzzing"] }
hx-ipc = { path = "../crates/hx-ipc", features = ["repo"] }
hx-proto = { path = "../crates/hx-proto" }
hx-pwcheck = { path = "../apps/hx-pwcheck" }
hx-transport = { path = "../crates/hx-transport", features = ["fuzzing"] }
prost = "0.14"
tempfile = "3"

# Seed generation (`cargo run --bin gen-seeds`).
spake2 = "0.4"
tar = { version = "0.4.46", default-features = false }

[[bin]]
name = "gen-seeds"
path = "src/bin/gen_seeds.rs"
test = false
doc = false

[profile.release]
debug = 1

# One entry per file of fuzz_targets/.
[[bin]]
name = "proto_control"
path = "fuzz_targets/proto_control.rs"
test = false
doc = false
bench = false

