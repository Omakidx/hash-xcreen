[package]
name = "hx-imagectl"
description = "Image CI tool: digests, image build, equivalence check, manifest and verification (CI only, never shipped)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "hx_imagectl"
path = "src/lib.rs"

[[bin]]
name = "hx-imagectl"
path = "src/main.rs"

[dependencies]
hx-provision.workspace = true
minisign-verify = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }
zeroize.workspace = true

[dev-dependencies]
minisign = "0.10.0" # signs the test manifests with a key made at test time
tempfile = "3.27.0"
