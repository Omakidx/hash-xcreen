[package]
name = "hx-agent"
description = "Server agent: hx-gatewayd, hx-privd and the hx-agent CLI (the backup worker is apps/hx-backup-worker)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test-only constructors of hx-privd (inject the gateway uid, fakes). A release build never
# enables it: only the crate's own dev-dependency on itself switches it on.
test-support = ["dep:tempfile"]
# Test-only hooks of the hx-gatewayd binary (`--admin-allow-uid`). Never enabled in a release
# build: the crate's own tests turn it on through the dev-dependency on itself below.
gateway-test-hooks = []
# Test-only hooks of `hx-agent install` (`--test-allow-container`, `--test-fail-after <stage>`) and
# the fakes of `install::testing`. Never enabled in a release build: the crate's own tests turn it
# on through the dev-dependency on itself below, and the release gate forbids it (design C12).
install-test-hooks = ["dep:tempfile"] # install::testing builds a TempDir; a bin build with only this feature must compile
# Test-only hook of hx-privd for hosts where /proc/sys is not writable (a nested VM or an
# unprivileged container in the installer's tests): a failed `sysctl -p` of the Incus drop-in, or
# sysctl values that did not take effect, become a warning and `SetupHostResult.sysctl_applied` is
# false, instead of failing `SetupHost`. NEVER in a release build: the release gate rejects it, and
# no crate enables it by default. The dev-dependency below deliberately does not turn it on.
privd-test-hooks = []
# The release gate (WS-3, installer 1E; src/privd/update/keys.rs and src/privd/image/keys.rs): turns
# the build into a compile error unless release-keys/{current,next}.pub AND image-keys/{current,next}.pub
# are provisioned, and forbids combining it with `test-support`, `test-release-key` or
# `test-image-key`. Only the release workflow enables it, and only for
# `cargo build -p hx-agent --bins --release --features release-build` (never --workspace or
# --all-targets, which would pull in the dev-dependency on this crate's own test features).
release-build = []
# Embeds one extra, TEST release key read from the HX_TEST_RELEASE_PUBKEY environment variable at
# build time (the base64 key line made by release/make-test-release.sh). For the installer test
# harness only; the release gate rejects it.
test-release-key = []
# Embeds one extra, TEST image key read from the HX_TEST_IMAGE_PUBKEY environment variable at build
# time (the base64 key line of a test key), next to the image keys of image-keys/. For the installer
# VM tests and the image CI, which sign a test image with a per-run key; the release gate rejects
# it, like `test-release-key`.
test-image-key = []

# Entry points for the cargo-fuzz targets in `fuzz/` (module `link::fuzz`). Never enabled by a build
# of the product: only the `fuzz` crate switches it on.
fuzzing = []

[dependencies]
argon2 = { version = "0.6.0", features = ["zeroize"] } # wipes its memory blocks (the CLI hashes typed secrets)
bytes.workspace = true
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
hkdf = "0.12"
hmac = "0.12"
hx-crypto.workspace = true
hx-ipc = { workspace = true, features = ["privd", "link"] }
hx-proto.workspace = true
hx-provision.workspace = true
hx-transport.workspace = true
libc = "0.2" # seccomp numbers (gateway) and SO_PEERGROUPS (privd::peergroups)
listenfd = "1.0.2"
minisign-verify = "0.3.0"
prost.workspace = true
rustix = { workspace = true, features = ["fs", "mm", "process", "net", "rand", "termios", "event", "stdio", "system"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.5"
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6.1"
tar = { version = "0.4.46", default-features = false }
tempfile = { version = "3.27.0", optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
toml = "0.8"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
zeroize.workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["pty", "termios", "fs"] } # a pseudo-terminal for the hidden-prompt test
crossbeam-channel.workspace = true
ffmpeg-next.workspace = true # the end-to-end test decodes the frames it receives
hx-capture.workspace = true
hx-session.workspace = true
x11rb = { workspace = true, features = ["xtest"] }
hx-agent = { path = ".", features = ["test-support", "gateway-test-hooks", "install-test-hooks"] }
hyper = "1" # the real-Incus test builds one raw `Request`
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3.27.0"
rcgen = "0.14.10"
minisign = "0.10.0"
