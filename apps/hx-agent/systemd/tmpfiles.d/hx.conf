# hash-xcreen runtime directories (docs/ipc.md section 3, "Runtime directories"; Part 2 section 11).
#
# Created at boot by systemd-tmpfiles, before any unit that needs them, so hx-privd needs no
# permission to create them and creates nothing in /run/hx/link itself.
#
#   Type Path           Mode User Group       Age
d /run/hx       0755 root root        -
d /run/hx/link  0750 root hx-gatewayd -

# One listening socket per backup or restore job (the repository link, docs/ipc.md section 24);
# root only. hx-privd opens it with O_NOFOLLOW and checks owner and mode.
d /run/hx/backup 0700 root root       -

# Root-owned configuration directory of the agent (host-firewall.nft, creds/); hx-privd writes the
# persisted ruleset here, so the unit's ReadWritePaths needs it to exist.
d /etc/hx       0755 root root        -

# iptables' lock file: hx-privd runs iptables (DOCKER-USER rules) under ProtectSystem=strict, where
# /run is read-only except for this one path.
f /run/xtables.lock 0600 root root    -

# privd's state directory and the mount point of the fetcher's size-capped tmpfs
# (var-lib-hx-updates.mount). hx-privd.service's StateDirectory=hx keeps the same mode.
d /var/lib/hx         0700 root root  -
d /var/lib/hx/updates 1733 root root  -

# Mount point of the image fetcher's size-capped tmpfs (var-lib-hx-imagein.mount, 80 MiB, 16
# inodes), root-only inside the state directory, mode 1733 like the update directory.
d /var/lib/hx/imagein 1733 root root  -

# Where the installer puts an offline image and its signed manifest (`--image-file`); neither
# gatewayd nor a fetcher can write there (root only, 0700).
d /var/lib/hx/import  0700 root root  -

# Mount point of the update fetcher's bind mount of /var/lib/hx/updates (hx-update-fetcher@.service);
# an empty directory, so the unit's namespace has somewhere to mount.
d /var/lib/hx-update 0755 root root   -

# The same for the image fetcher's bind mount of /var/lib/hx/imagein (hx-image-fetcher@.service).
d /var/lib/hx-image  0755 root root   -
