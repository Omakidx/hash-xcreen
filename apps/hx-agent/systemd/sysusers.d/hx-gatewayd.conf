# The unprivileged user of hx-gatewayd (docs/ipc.md section 1.1, "Gateway" principal).
#
# A system user with its own group and no other membership: privd checks at start that it is in
# none of incus, incus-admin, docker, disk, sudo, wheel, adm, systemd-journal, lxd, shadow or
# kvm, and that no other user is in the hx-gatewayd group (membership would grant access to the
# privd socket and the link directory).
#
# Type Name        ID  GECOS                 Home                 Shell
u      hx-gatewayd -   "hash-xcreen gateway" /var/lib/hx-gatewayd /usr/sbin/nologin
