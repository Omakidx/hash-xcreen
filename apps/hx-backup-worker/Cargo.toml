[package]
name = "hx-backup-worker"
description = "The backup worker (PID 1 of the network-less helper container) and the Drive helper role: one binary, two roles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "hx_backup_worker"
path = "src/lib.rs"

[[bin]]
name = "hx-backup-worker"
path = "src/main.rs"

[features]
# Test hooks of the binary (docs/ipc.md §24): the run directory of the listener
# (`HX_WORKER_RUN_DIR`), the source and target directories (`HX_WORKER_SRC`, `HX_WORKER_DST`) and
# `HX_WORKER_NO_OWNERSHIP` (restore without chown, for a test that is not root). NEVER in a release
# build: only this package's own dev-dependency on itself turns it on, as hx-agent does for its hooks.
test-hooks = []

[dependencies]
bytes.workspace = true # the id fields of the generated messages
# The Drive helper role (docs/ipc.md section 29; tech-stack "Google Drive access"). OpenDAL is pinned
# exactly: its gdrive deleter only trashes, and the helper rewrites that one request (drive/transport.rs).
opendal = { version = "=0.59.5", default-features = false, features = ["services-gdrive"] }
# One HTTP client of our own, on hyper-util's pooled client with a hand-written TLS connector (not
# reqwest: its rustls stack enables rustls's `tls12` feature, which deny.toml bans). TLS 1.3 only,
# rustls with ring, the platform roots; no redirect, no proxy, no HTTP/2.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tower-service = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
http = "1"
http-body = "1"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
hx-backup = { path = "../../crates/hx-backup", version = "0.1.0", features = ["engine"] }
hx-ipc = { workspace = true, features = ["repo"] }
libc = "0.2" # capset, prctl and sigaction in sandbox.rs, and the seccomp syscall numbers
rustix = { workspace = true, features = ["process", "thread", "rand", "net", "event", "system", "fs", "stdio"] }
seccompiler = "0.5"
sha2 = "0.10"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
zeroize.workspace = true

[dev-dependencies]
libc = "0.2"
# The fake Google server of the Drive tests: a test CA made at test time, served over TLS.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
rustix = { workspace = true, features = ["process"] }
hx-backup-worker = { path = ".", features = ["test-hooks"] }
tempfile = "3.27.0"
