[package]
name = "hx-session"
description = "In-container session daemon: capture, encode, audio, clipboard and input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "hx-session"
path = "src/main.rs"

[[bin]]
name = "hx-session-bench"
path = "src/bin/bench/main.rs"

[dependencies]
crossbeam-channel.workspace = true
hx-capture.workspace = true
hx-codec.workspace = true
rustix = { workspace = true, features = ["time"] }
thiserror.workspace = true
x11rb.workspace = true

[dev-dependencies]
x11rb = { workspace = true, features = ["xtest"] }
