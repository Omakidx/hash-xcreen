[package]
name = "hx-session"
description = "In-container session daemon: capture, encode, audio, clipboard and input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "hx-session"
path = "src/main.rs"

[[bin]]
name = "hx-session-bench"
path = "src/bin/bench/main.rs"

[dependencies]
bytes.workspace = true
crossbeam-channel.workspace = true
hx-capture.workspace = true
hx-codec.workspace = true
# Only the session link feature: no privd messages and nothing that pulls in quinn.
hx-ipc = { workspace = true, features = ["link"] }
hx-proto.workspace = true
rustix = { workspace = true, features = ["event", "fs", "net", "process", "time"] }
thiserror.workspace = true
x11rb.workspace = true

[dev-dependencies]
criterion.workspace = true
x11rb = { workspace = true, features = ["xtest"] }

[[bench]]
name = "capture_to_encode"
harness = false
